name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
          enable-cache: true
      - run: uv sync --extra multimodal --extra video --extra dev
      - run: uv run ruff check src scripts tests
      - run: uv run pytest -q
      - run: uv run python scripts/check_markdown_links.py
