experiment:
  name: vlm-sft-mps
  seed: 42
  device: mps

model:
  alignment_checkpoint: artifacts/checkpoints/vlm-alignment-mps.pt
  vision_encoder: assets/models/siglip2-base-p32-256-ve
  vocab_size: 6400
  hidden_size: 768
  num_hidden_layers: 8
  num_attention_heads: 8
  num_key_value_heads: 4
  intermediate_size: 2432
  max_position_embeddings: 32768
  image_hidden_size: 768
  image_token_id: 12
  image_token_length: 64

tokenizer:
  path: assets/tokenizer

data:
  path: data/raw/sft_i2t.parquet
  sequence_length: 768
  image_size: 256
  validation_samples: 512

training:
  stage: projector-and-llm-boundary-layers
  epochs: 2
  batch_size: 2
  gradient_accumulation_steps: 8
  learning_rate: 0.000005
  weight_decay: 0.1
  grad_clip: 1.0
  log_interval: 20
  save_interval: 1000
  checkpoint_path: artifacts/checkpoints/vlm-sft-mps.pt
