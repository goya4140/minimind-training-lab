experiment:
  name: vlm-vision-alignment
  seed: 42
  device: cuda

model:
  language_checkpoint: artifacts/checkpoints/llm-64m-sft.pt
  vision_encoder: assets/models/siglip2-base-p32-256-ve
  vocab_size: 6400
  hidden_size: 768
  num_hidden_layers: 8
  num_attention_heads: 8
  num_key_value_heads: 4
  intermediate_size: 2432
  max_position_embeddings: 32768
  image_hidden_size: 768
  image_token_id: 12
  image_token_length: 64

data:
  path: data/raw/pretrain_i2t.parquet
  sequence_length: 450
  image_size: 256

training:
  stage: projector-only
  epochs: 2
  batch_size: 16
  learning_rate: 0.0004
  precision: bfloat16
  checkpoint_path: artifacts/checkpoints/vlm-alignment.pt

