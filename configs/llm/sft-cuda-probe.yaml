experiment:
  name: llm-64m-sft-cuda-probe-v2
  seed: 43
  device: cuda
  deterministic: true
model:
  vocab_size: 6400
  hidden_size: 768
  num_hidden_layers: 8
  num_attention_heads: 8
  num_key_value_heads: 4
  intermediate_size: 2432
  max_position_embeddings: 32768
  rope_theta: 1000000.0
  dropout: 0.0
tokenizer:
  path: assets/tokenizer
data:
  path: data/raw/sft_t2t_mini.jsonl
  sequence_length: 768
  validation_samples: 2
training:
  initial_checkpoint: artifacts/checkpoints/llm-64m-pretrain-cuda-probe-v2.pt
  steps: 8
  batch_size: 4
  gradient_accumulation_steps: 2
  learning_rate: 1.0e-05
  weight_decay: 0.1
  grad_clip: 1.0
  log_interval: 1
  save_interval: 4
  checkpoint_path: artifacts/checkpoints/llm-64m-sft-cuda-probe-v2.pt
  precision: bfloat16
