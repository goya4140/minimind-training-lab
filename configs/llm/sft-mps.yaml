experiment:
  name: llm-64m-sft-mps
  seed: 43
  device: mps

model:
  vocab_size: 6400
  hidden_size: 768
  num_hidden_layers: 8
  num_attention_heads: 8
  num_key_value_heads: 4
  intermediate_size: 2432
  max_position_embeddings: 32768
  rope_theta: 1000000.0
  dropout: 0.0

tokenizer:
  path: assets/tokenizer

data:
  path: data/raw/sft_t2t_mini.jsonl
  sequence_length: 768
  validation_samples: 2048

training:
  initial_checkpoint: artifacts/checkpoints/llm-64m-pretrain-mps.pt
  # 40,000 micro-steps × batch 4 = 160,000 deterministic sample exposures.
  steps: 40000
  batch_size: 4
  gradient_accumulation_steps: 4
  learning_rate: 0.00001
  weight_decay: 0.1
  grad_clip: 1.0
  log_interval: 20
  save_interval: 2000
  checkpoint_path: artifacts/checkpoints/llm-64m-sft-mps.pt
