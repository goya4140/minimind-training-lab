experiment:
  name: llm-64m-pretrain
  seed: 42
  device: cuda

model:
  vocab_size: 6400
  hidden_size: 768
  num_hidden_layers: 8
  num_attention_heads: 8
  num_key_value_heads: 4
  intermediate_size: 2432
  max_position_embeddings: 32768
  rope_theta: 1000000.0
  dropout: 0.0

data:
  path: data/processed/pretrain.jsonl
  sequence_length: 768
  tokenizer_path: assets/tokenizer

training:
  epochs: 2
  batch_size: 32
  gradient_accumulation_steps: 8
  learning_rate: 0.0005
  weight_decay: 0.1
  grad_clip: 1.0
  precision: bfloat16
  log_interval: 100
  save_interval: 1000
  checkpoint_path: artifacts/checkpoints/llm-64m-pretrain.pt

