experiment:
  name: llm-64m-mps-probe
  seed: 42
  device: auto

model:
  vocab_size: 6400
  hidden_size: 768
  num_hidden_layers: 8
  num_attention_heads: 8
  num_key_value_heads: 4
  intermediate_size: 2432
  max_position_embeddings: 32768
  rope_theta: 1000000.0
  dropout: 0.0

tokenizer:
  path: assets/tokenizer

data:
  path: data/raw/pretrain_t2t_mini.jsonl
  sequence_length: 340
  validation_samples: 16

training:
  steps: 12
  batch_size: 8
  gradient_accumulation_steps: 1
  learning_rate: 0.0005
  weight_decay: 0.1
  grad_clip: 1.0
  log_interval: 1
  save_interval: 12
  checkpoint_path: artifacts/checkpoints/llm-64m-mps-probe.pt
