experiment:
  name: omni-a2a-sft
  seed: 46
  device: cuda

model:
  checkpoint: artifacts/checkpoints/omni-audio-alignment.pt
  audio_encoder: assets/models/SenseVoiceSmall
  codec: assets/models/mimi

tokenizer:
  path: assets/tokenizer

data:
  path: data/raw/sft_a2a_mini.parquet
  sequence_length: 768
  validation_samples: 128

training:
  stage: joint
  epochs: 1
  batch_size: 16
  learning_rate: 0.00002
  weight_decay: 0.1
  gradient_accumulation_steps: 1
  grad_clip: 1.0
  log_interval: 20
  save_interval: 1000
  checkpoint_path: artifacts/checkpoints/omni-a2a-sft.pt

