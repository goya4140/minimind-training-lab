experiment:
  name: omni-t2a
  seed: 44
  device: cuda

model:
  language_checkpoint: artifacts/checkpoints/llm-64m-sft-mps.pt
  hidden_size: 768
  num_hidden_layers: 8
  num_talker_hidden_layers: 4
  talker_hidden_size: 768
  num_audio_codebooks: 8
  audio_vocab_size: 2112
  audio_pad_token_id: 2049
  audio_stop_token_id: 2050
  audio_hidden_size: 512

tokenizer:
  path: assets/tokenizer

data:
  path: data/raw/sft_t2a_mini.parquet
  sequence_length: 512
  validation_samples: 128

training:
  stage: text-to-audio
  epochs: 1
  batch_size: 40
  learning_rate: 0.0005
  weight_decay: 0.1
  gradient_accumulation_steps: 1
  grad_clip: 1.0
  log_interval: 20
  save_interval: 1000
  checkpoint_path: artifacts/checkpoints/omni-t2a.pt
