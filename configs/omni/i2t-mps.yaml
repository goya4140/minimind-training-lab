experiment:
  name: omni-i2t-mps
  seed: 47
  device: mps

model:
  checkpoint: artifacts/checkpoints/omni-a2a-sft-mps.pt
  vision_encoder: assets/models/siglip2-base-p32-256-ve

tokenizer:
  path: assets/tokenizer

data:
  path: data/raw/sft_i2t.parquet
  sequence_length: 768
  validation_samples: 128

training:
  stage: vision-projector-only
  # 10,000 micro-steps × batch 4 = 40,000 deterministic image-text exposures.
  steps: 10000
  batch_size: 4
  gradient_accumulation_steps: 4
  learning_rate: 0.0004
  weight_decay: 0.1
  grad_clip: 1.0
  log_interval: 20
  save_interval: 1000
  checkpoint_path: artifacts/checkpoints/omni-i2t-mps.pt
