experiment:
  name: omni-a2a-sft-mps
  seed: 46
  device: mps

model:
  checkpoint: artifacts/checkpoints/omni-audio-alignment-mps.pt
  audio_encoder: assets/models/SenseVoiceSmall
  codec: assets/models/mimi

tokenizer:
  path: assets/tokenizer

data:
  path: data/raw/sft_a2a_mini.parquet
  sequence_length: 768
  validation_samples: 128

training:
  stage: joint
  # 10,000 micro-steps × batch 4 = 40,000 deterministic A2A exposures.
  steps: 10000
  batch_size: 4
  gradient_accumulation_steps: 4
  learning_rate: 0.00002
  weight_decay: 0.1
  grad_clip: 1.0
  log_interval: 20
  save_interval: 1000
  checkpoint_path: artifacts/checkpoints/omni-a2a-sft-mps.pt
