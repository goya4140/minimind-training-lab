experiment:
  name: omni-i2t
  seed: 47
  device: cuda

model:
  checkpoint: artifacts/checkpoints/omni-a2a-sft.pt
  vision_encoder: assets/models/siglip2-base-p32-256-ve

tokenizer:
  path: assets/tokenizer

data:
  path: data/raw/sft_i2t.parquet
  sequence_length: 768
  validation_samples: 128

training:
  stage: vision-projector-only
  epochs: 1
  batch_size: 16
  learning_rate: 0.0004
  weight_decay: 0.1
  gradient_accumulation_steps: 1
  grad_clip: 1.0
  log_interval: 20
  save_interval: 1000
  checkpoint_path: artifacts/checkpoints/omni-i2t.pt
